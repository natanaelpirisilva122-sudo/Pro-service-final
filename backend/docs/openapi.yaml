openapi: 3.0.3
info:
  title: Pro Service API
  version: 1.0.0
  description: >
    API REST do Projeto Integrador Pro Service, responsável por autenticação,
    perfis de prestadores, habilidades, solicitações de serviço, controle de status
    e avaliações.
servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Autenticação
  - name: Prestadores
  - name: Habilidades
  - name: Serviços
  - name: Avaliações

paths:
  /auth/cadastro:
    post:
      tags: [Autenticação]
      summary: Cadastra cliente ou prestador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário cadastrado
        '409':
          description: E-mail já cadastrado

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica o usuário e devolve JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login efetuado
        '401':
          description: Credenciais inválidas

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna o usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado

  /habilidades:
    get:
      tags: [Habilidades]
      summary: Lista o catálogo de habilidades
      responses:
        '200':
          description: Catálogo de habilidades

  /prestadores:
    get:
      tags: [Prestadores]
      summary: Busca prestadores com pelo menos uma habilidade
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: habilidade
          schema: { type: string }
        - in: query
          name: cidade
          schema: { type: string }
        - in: query
          name: uf
          schema: { type: string, minLength: 2, maxLength: 2 }
        - in: query
          name: precoMax
          schema: { type: number, minimum: 0 }
      responses:
        '200':
          description: Prestadores encontrados

  /prestadores/me:
    get:
      tags: [Prestadores]
      summary: Consulta o próprio perfil de prestador
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil
    patch:
      tags: [Prestadores]
      summary: Atualiza o próprio perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdateRequest'
      responses:
        '200':
          description: Perfil atualizado

  /prestadores/me/habilidades:
    post:
      tags: [Prestadores]
      summary: Vincula habilidade ao prestador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [habilidadeId]
              properties:
                habilidadeId:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Habilidade vinculada

  /prestadores/me/habilidades/{id}:
    delete:
      tags: [Prestadores]
      summary: Remove habilidade do prestador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Habilidade removida

  /prestadores/{id}:
    get:
      tags: [Prestadores]
      summary: Consulta perfil público e avaliações do prestador
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Perfil do prestador

  /servicos:
    post:
      tags: [Serviços]
      summary: Cliente abre uma solicitação de serviço
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
      responses:
        '201':
          description: Serviço criado
        '409':
          description: Prestador sem habilidade

  /servicos/meus:
    get:
      tags: [Serviços]
      summary: Lista serviços do usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ServiceStatus'
      responses:
        '200':
          description: Serviços do usuário

  /servicos/oportunidades:
    get:
      tags: [Serviços]
      summary: Lista solicitações pendentes do prestador autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Oportunidades

  /servicos/{id}:
    get:
      tags: [Serviços]
      summary: Consulta serviço pertencente ao usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Serviço

  /servicos/{id}/status:
    patch:
      tags: [Serviços]
      summary: Altera status respeitando as transições de negócio
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACEITO, CONCLUIDO, CANCELADO]
      responses:
        '200':
          description: Status atualizado
        '409':
          description: Transição de status inválida

  /avaliacoes:
    post:
      tags: [Avaliações]
      summary: Cliente avalia um serviço concluído
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Avaliação criada
        '409':
          description: Serviço não concluído ou já avaliado

  /avaliacoes/prestador/{id}:
    get:
      tags: [Avaliações]
      summary: Lista avaliações recebidas pelo prestador
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Avaliações

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [nome, email, senha, tipo]
      properties:
        nome:
          type: string
          example: Maria da Silva
        email:
          type: string
          format: email
          example: maria@exemplo.com
        telefone:
          type: string
          example: "(62) 99999-9999"
        senha:
          type: string
          minLength: 8
          example: SenhaSegura123
        tipo:
          type: string
          enum: [CLIENTE, PRESTADOR]

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string

    ProviderUpdateRequest:
      type: object
      properties:
        descricao:
          type: string
        cidade:
          type: string
        uf:
          type: string
        precoHora:
          type: number
        anosExperiencia:
          type: integer

    ServiceStatus:
      type: string
      enum: [PENDENTE, ACEITO, CONCLUIDO, CANCELADO]

    ServiceCreateRequest:
      type: object
      required:
        [prestadorId, titulo, descricao, categoria, endereco, cidade, uf]
      properties:
        prestadorId:
          type: integer
        titulo:
          type: string
        descricao:
          type: string
        categoria:
          type: string
        endereco:
          type: string
        cidade:
          type: string
        uf:
          type: string
        valorCombinado:
          type: number

    ReviewCreateRequest:
      type: object
      required: [servicoId, nota]
      properties:
        servicoId:
          type: integer
        nota:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
